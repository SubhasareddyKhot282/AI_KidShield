<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI-Kid Shield — Setup</title>
  <style>
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f6fbff; color: #0f172a; }
    .wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .card { width: 100%; max-width: 520px; background: rgba(255,255,255,0.9); border: 1px solid #cfe4ff; border-radius: 16px; padding: 28px; box-shadow: 0 10px 30px rgba(14,165,233,0.10); }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0 0 18px; color: #4b637a; line-height: 1.5; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 14px 16px; border-radius: 12px; border: none; cursor: pointer; background: linear-gradient(135deg, #0ea5e9, #2563eb); color: #fff; font-weight: 700; font-size: 15px; }
    .note { font-size: 12px; color: #4b637a; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Setup Email Alerts</h1>
      <p>Enter Parent Email, Child Email, and the Child Email password (recommended: Gmail App Password).</p>

      <div style="display:flex;flex-direction:column;gap:10px;">
        <input id="parentEmail" type="email" placeholder="Parent email (receiver)" style="padding:14px;border-radius:12px;border:1px solid #cfe4ff;font-size:15px;" />
        <input id="childEmail" type="email" placeholder="Child email (sender)" style="padding:14px;border-radius:12px;border:1px solid #cfe4ff;font-size:15px;" />
        <input id="emailPassword" type="password" placeholder="Child email password / App password" style="padding:14px;border-radius:12px;border:1px solid #cfe4ff;font-size:15px;" />
      </div>
      <div style="height:12px"></div>
      <button class="btn" onclick="save()">Save</button>
      <div class="note" id="status"></div>
      <div class="note">Then open the Evidence page to view screenshots/audio: <b>/media.html</b></div>
    </div>
  </div>

  <script>
    async function save() {
      const status = document.getElementById('status');
      const parentEmail = document.getElementById('parentEmail').value.trim();
      const childEmail = document.getElementById('childEmail').value.trim();
      const emailPassword = document.getElementById('emailPassword').value;

      status.textContent = 'Saving...';
      const res = await fetch('/api/config/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ parentEmail, childEmail, emailPassword })
      });
      const data = await res.json().catch(()=>null);
      if (!res.ok) {
        status.textContent = 'Failed: ' + (data?.error || 'error');
        return;
      }
      localStorage.setItem('childEmail', data.childEmail);
      status.textContent = 'Saved ✓';
      window.location.href = '/media.html';
    }
  </script>
</body>
</html>
